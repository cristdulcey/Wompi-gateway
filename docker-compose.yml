services:
  postgres:
    image: postgres:16-alpine
    container_name: wompi-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: ${DOCKER_IMAGE:-cristiandulcey/wompi-gateway}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wompi-gateway-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      HTTP_FORWARD_TIMEOUT: ${HTTP_FORWARD_TIMEOUT:-15s}
      GIN_MODE: ${GIN_MODE:-release}
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"

volumes:
  pgdata:
