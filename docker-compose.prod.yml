services:
  postgres:
    image: postgres:16-alpine
    container_name: wompi-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  gateway:
    image: ${DOCKER_IMAGE:-cristiandulcey/wompi-gateway}:${IMAGE_TAG:-latest}
    container_name: wompi-gateway-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
      HTTP_FORWARD_TIMEOUT: ${HTTP_FORWARD_TIMEOUT:-15s}
      GIN_MODE: ${GIN_MODE:-release}
    expose:
      - "${PORT:-8080}"
    networks:
      - internal
      - edge

  caddy:
    image: caddy:2-alpine
    container_name: wompi-gateway-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - edge

networks:
  internal:
    internal: true
  edge:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
